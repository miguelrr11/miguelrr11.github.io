<style>
  :root {

    --chip: #fff;
    --xp: #4a8a26;
    --online: #23873a;
    --pop: #fff;
    --gap: #dcedfa;
    --gold: #e7ac12;
    --gold-glow: rgba(255,196,0,.55);
    --win: rgba(255,214,90,.3); --win-ring: rgba(214,158,0,.35);
    --slot: #8b8b8b; --slot-dark: #373737; --slot-light: #fff;

    --p1: #2a78d6; --p2: #eb6834; --p3: #1baf7a; --p4: #eda100;
    --p5: #e87ba4; --p6: #008300; --p7: #6250d6; --p8: #e34948; --p-other: #8a96a3;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky: #0f1b33; --sky-low: #22335a; --ink: #eef3fa; --ink-soft: #a9b8cc;
      --grass: #3f7422; --grass-dark: #2f5a18; --dirt: #5a3c22; --dirt-dark: #432c18;
      --off: #ff8a73; --panel: rgba(255,255,255,.08); --track: rgba(255,255,255,.12);
      --grid: rgba(255,255,255,.22); --tile: rgba(255,255,255,.06); --chip: rgba(255,255,255,.18);
      --xp: #5ea832; --online: #5fd36e;
      --pop: #1c2a47; --gap: #2a3753; --gold: #f5c542; --gold-glow: rgba(255,200,40,.45); --win: rgba(245,197,66,.13); --win-ring: rgba(245,197,66,.35);
      --slot: #5a5a5a; --slot-dark: #262626; --slot-light: #8f8f8f;
      --p1: #3987e5; --p2: #d95926; --p3: #199e70; --p4: #c98500;
      --p5: #d55181; --p6: #008300; --p7: #9085e9; --p8: #e66767; --p-other: #7d8a99;
    }
  }
  :root[data-theme="dark"] {
    --sky: #0f1b33; --sky-low: #22335a; --ink: #eef3fa; --ink-soft: #a9b8cc;
    --grass: #3f7422; --grass-dark: #2f5a18; --dirt: #5a3c22; --dirt-dark: #432c18;
    --off: #ff8a73; --panel: rgba(255,255,255,.08); --track: rgba(255,255,255,.12);
    --grid: rgba(255,255,255,.22); --tile: rgba(255,255,255,.06); --chip: rgba(255,255,255,.18);
    --xp: #5ea832; --online: #5fd36e;
    --pop: #1c2a47; --gap: #2a3753; --gold: #f5c542; --gold-glow: rgba(255,200,40,.45); --win: rgba(245,197,66,.13); --win-ring: rgba(245,197,66,.35);
    --slot: #5a5a5a; --slot-dark: #262626; --slot-light: #8f8f8f;
    --p1: #3987e5; --p2: #d95926; --p3: #199e70; --p4: #c98500;
    --p5: #d55181; --p6: #008300; --p7: #9085e9; --p8: #e66767; --p-other: #7d8a99;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky-low) 100%) fixed;
    background-color: var(--sky);
    color: var(--ink);
    font: 400 1.0625rem/1.5 Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { flex: 1; width: 100%; }
  .wrap { width: 100%; max-width: 34rem; margin: 0 auto; padding: 3rem 1.25rem 2.5rem; }
  .addr {
    margin: 0 0 1.75rem;
    color: var(--ink-soft);
    font-size: .95rem;
    word-break: break-all;
  }
  .addr button {
    background: none; border: 0; padding: 0; margin-left: .4rem;
    color: inherit; text-decoration: underline; font: inherit; cursor: pointer;
  }
  h1 {
    margin: 0 0 .5rem;
    font: 700 clamp(2rem, 9vw, 3.1rem)/1.1 Silkscreen, "Courier New", monospace;
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  h1.off { color: var(--off); }
  .sub { margin: 0 0 2.25rem; color: var(--ink-soft); }

  .players { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
  .player {
    display: flex; align-items: center; gap: 1rem;
    padding: .6rem .9rem .6rem .6rem;
    background: var(--panel);
    border-radius: 6px;
  }
  .head {
    width: 56px; height: 56px; flex: none;
    image-rendering: pixelated;
    border-radius: 3px;
    background: var(--dirt);
    box-shadow: 0 3px 0 var(--dirt-dark);
  }
  .player-name { font-weight: 600; font-size: 1.15rem; word-break: break-all; }
  .note { margin-top: 1rem; font-size: .9rem; color: var(--ink-soft); }
  .last { display: flex; align-items: center; gap: .65rem; margin: -1rem 0 0; color: var(--ink-soft); }
  .last .head { width: 28px; height: 28px; box-shadow: 0 2px 0 var(--dirt-dark); }
  .last b { color: var(--ink); font-weight: 600; }

  /* ===== Estadísticas ===== */
  .sec { margin-top: 3rem; }
  h2 { margin: 0 0 1rem; font: 700 1.35rem/1.2 Silkscreen, "Courier New", monospace; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem .75rem; margin-bottom: 1rem; }
  .sec-head h2 { margin: 0; }
  h3 { margin: 1.25rem 0 .5rem; font-size: .95rem; font-weight: 600; color: var(--ink-soft); }
  .muted { color: var(--ink-soft); font-weight: 400; }
  .stack { display: grid; gap: .5rem; }
  .card { background: var(--panel); border-radius: 6px; padding: .9rem; }
  .card > h3:first-child { margin-top: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .4rem .75rem; margin-bottom: .5rem; }
  .card-head h3 { margin: 0; }
  .dot { display: inline-block; width: .55rem; height: .55rem; margin: 0 .1rem 0 .4rem; border-radius: 50%; background: var(--online); vertical-align: .1em; }
  .seen .dot { margin: 0 .35rem 0 0; }
  .link { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; }

  /* Selectores (Total / 7 días, Por día / Acumulado) */
  .seg { display: inline-flex; padding: 3px; border-radius: 6px; background: var(--track); }
  .seg button {
    font: 600 .85rem Figtree, system-ui, sans-serif; color: var(--ink-soft);
    padding: .35rem .75rem; border: 0; border-radius: 4px; background: none; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--chip); color: var(--ink); }
  .seg.small { margin-bottom: .5rem; }
  .seg.small button { font-size: .8rem; padding: .25rem .6rem; }

  /* Interruptor de vista avanzada */
  .switch {
    display: inline-flex; align-items: center; gap: .5rem; padding: .2rem 0; border: 0; background: none;
    color: var(--ink-soft); font: 600 .85rem Figtree, system-ui, sans-serif; cursor: pointer;
  }
  .switch-track { position: relative; width: 2.1rem; height: 1.2rem; border-radius: 1rem; background: var(--track); transition: background .15s; }
  .switch-track::after {
    content: ""; position: absolute; top: .15rem; left: .15rem; width: .9rem; height: .9rem; border-radius: 50%;
    background: var(--chip); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
  }
  .switch[aria-checked="true"] { color: var(--ink); }
  .switch[aria-checked="true"] .switch-track { background: var(--grass); }
  .switch[aria-checked="true"] .switch-track::after { transform: translateX(.9rem); background: #fff; }

  /* Jugadores: ranking que se despliega en la ficha */
  .ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
  .ficha { background: var(--panel); border-radius: 6px; }
  .ficha summary { display: flex; align-items: center; gap: .75rem; padding: .55rem .9rem .55rem .5rem; cursor: pointer; list-style: none; }
  .ficha summary::-webkit-details-marker { display: none; }
  .ficha summary:hover .player-name { text-decoration: underline; }
  .pos {
    width: 1.4rem; flex: none; text-align: center;
    font: 700 .95rem Silkscreen, "Courier New", monospace;
    color: var(--ink-soft);
  }
  .ficha summary .head { width: 40px; height: 40px; box-shadow: 0 2px 0 var(--dirt-dark); }
  .rank-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .rank-line { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; column-gap: .75rem; }
  .ficha .player-name { font-size: 1.05rem; }
  .seen { font-size: .85rem; line-height: 1.3; color: var(--ink-soft); }
  .time { color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { display: block; height: 6px; margin-top: .4rem; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--xp); border-radius: 3px; }
  .chev { flex: none; width: .55rem; height: .55rem; margin-bottom: .2rem; border: solid var(--ink-soft); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .ficha[open] .chev { margin: .2rem 0 0; transform: rotate(-135deg); }
  .ficha-body { padding: .25rem .9rem 1rem; }

  .tiles { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr)); gap: .4rem; }
  .tiles div { padding: .45rem .6rem; background: var(--tile); border-radius: 4px; }
  .tiles dt { font-size: .8rem; color: var(--ink-soft); }
  .tiles dd { margin: 0; font-weight: 600; font-size: 1.05rem; }
  .tiles small { display: block; font-weight: 400; font-size: .75rem; color: var(--ink-soft); }

  .favs { margin: 0; display: grid; gap: .35rem; }
  .favs div, .dist li, .recent li, .hitos li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .1rem .75rem; }
  .favs dt { color: var(--ink-soft); }
  .favs dd { margin: 0; font-weight: 600; }
  .dist, .recent, .hitos { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
  .dist .bar { flex-basis: 100%; margin-top: .1rem; }
  .hitos .pending { color: var(--ink-soft); }
  .hitos .pending .ico { opacity: .45; filter: grayscale(1); }
  .with-ico { display: inline-flex; align-items: center; gap: .5rem; min-width: 0; }
  .with-ico .ico { --s: 1.5rem; }
  .hito-who { display: inline-flex; align-items: center; gap: .35rem; margin-left: auto; font-weight: 600; }
  .hito-who .head { width: 22px; height: 22px; box-shadow: none; border-radius: 2px; }
  .h3-row { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; }
  .h3-row .link { font-size: .85rem; color: var(--ink-soft); white-space: nowrap; }

  /* Iconos del juego: advancements.png es una rejilla de --cols x --rows */
  .ico {
    --s: 2rem;
    display: block; flex: none; width: var(--s); height: var(--s);
    background: url("advancements.png") no-repeat;
    background-size: calc(var(--cols, 16) * 100%) calc(var(--rows, 8) * 100%);
    image-rendering: pixelated;
  }
  .frame { --s: 3rem; display: grid; place-items: center; }
  .frame > .ico { --s: 1.5rem; }

  /* Premios */
  .awards { container: awards / inline-size; list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
  .award {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "slot text win" "slot rest rest";
    align-items: center; gap: .3rem .8rem; padding: .7rem .8rem .7rem .7rem;
    background: var(--panel); border-radius: 6px;
  }
  .slot {
    grid-area: slot; align-self: start; display: grid; place-items: center; width: 3rem; height: 3rem;
    background: var(--slot); box-shadow: inset 3px 3px 0 var(--slot-dark), inset -3px -3px 0 var(--slot-light);
  }
  .award-emoji { font-size: 1.5rem; line-height: 1; }
  .award-text { grid-area: text; display: flex; flex-direction: column; min-width: 0; }
  .award-title { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  .award-desc { font-size: .8rem; line-height: 1.3; color: var(--ink-soft); }
  .award-win {
    grid-area: win; display: flex; align-items: center; gap: .5rem; min-width: 0; max-width: 11.5rem;
    padding: .3rem .55rem .3rem .3rem; border-radius: 6px; background: var(--win); box-shadow: inset 0 0 0 1px var(--win-ring);
  }
  .award-win.muted { background: none; box-shadow: none; font-size: .9rem; }
  .award-heads { display: flex; flex: none; }
  .award-heads .head + .head { margin-left: -10px; }
  .award-win .head { width: 28px; height: 28px; }
  .award-who { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .award-name { font-weight: 600; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .award-value { font-size: .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .award-rest { grid-area: rest; display: flex; flex-wrap: wrap; gap: .15rem .9rem; font-size: .8rem; color: var(--ink-soft); }
  .award-rest > span { display: inline-flex; align-items: center; gap: .3rem; white-space: nowrap; }
  .award-rest .head { width: 18px; height: 18px; box-shadow: none; border-radius: 2px; }
  @container awards (min-width: 34rem) {
    .award { grid-template-columns: auto minmax(0, 1fr) 11.5rem 8.5rem; grid-template-areas: "slot text win rest"; }
    .award-rest { flex-direction: column; }
  }

  /* Gráficas de columnas (apiladas por jugador) */
  .legend { list-style: none; margin: 0 0 .25rem; padding: 0; display: flex; flex-wrap: wrap; gap: .2rem .9rem; font-size: .8rem; color: var(--ink-soft); }
  .legend li { display: inline-flex; align-items: center; gap: .35rem; }
  .legend i { width: .65rem; height: .65rem; border-radius: 2px; }
  .legend.lines i { height: 2px; width: .9rem; border-radius: 1px; }
  .cols { display: flex; height: 7.5rem; padding-top: 1.25rem; border-bottom: 1px solid var(--grid); }
  .chart.small .cols { height: 4.75rem; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; cursor: default; }
  .col > * { flex: none; }
  .col-bar { width: 70%; max-width: 18px; min-height: 0; display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 4px 4px 0 0; overflow: hidden; }
  .col-bar span { flex-basis: 0; min-height: 0; }
  .col:hover .col-bar, .col:focus-visible .col-bar { filter: brightness(1.15); }
  .col-val { margin-bottom: 2px; font-size: .75rem; color: var(--ink-soft); white-space: nowrap; }
  .xlabels { display: flex; margin-top: .25rem; }
  .xlabels span { flex: 1; min-width: 0; text-align: center; white-space: nowrap; font-size: .7rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* Gráfica avanzada (SVG) */
  .timeline { position: relative; min-height: 12rem; touch-action: pan-y; }
  .timeline svg { display: block; overflow: visible; }
  .timeline svg:focus-visible { outline: 3px solid #ffd54a; outline-offset: 2px; border-radius: 4px; }
  .timeline .gl { stroke: var(--grid); stroke-width: 1; opacity: .6; }
  .timeline .base { stroke: var(--grid); stroke-width: 1; }
  .timeline text { fill: var(--ink-soft); font: .7rem Figtree, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .timeline .cross { stroke: var(--ink-soft); stroke-width: 1; }
  .timeline .gapline { fill: none; stroke: var(--gap); stroke-width: 1.5; }

  .tip {
    position: fixed; left: 0; top: 0; z-index: 10; pointer-events: none;
    display: grid; max-width: 17rem; padding: .5rem .65rem; border-radius: 6px;
    background: var(--ink); color: var(--sky-low);
    font-size: .85rem; line-height: 1.35;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  .tip[hidden] { display: none; }
  .tip strong { font-size: .95rem; }
  .tip-row { display: flex; align-items: center; gap: .4rem; }
  .tip-row i { flex: none; width: .8rem; height: 3px; border-radius: 2px; }
  .tip-row b { font-weight: 600; color: #fff; }
  :root[data-theme="light"] .tip-row b { color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tip-row b { color: var(--sky); } }
  :root[data-theme="dark"] .tip-row b { color: var(--sky); }

  /* Logros */
  .adv-sum { margin: -.5rem 0 1rem; color: var(--ink-soft); font-size: .95rem; }
  .scroller { display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none; margin: 0 -1.25rem .6rem; padding: 0 1.25rem 2px; }
  .scroller::-webkit-scrollbar { display: none; }
  .adv-tab {
    display: inline-flex; align-items: center; gap: .45rem; flex: none;
    padding: .35rem .75rem .35rem .4rem; border: 0; border-radius: 6px; background: var(--track);
    color: var(--ink-soft); font: 600 .9rem Figtree, system-ui, sans-serif; cursor: pointer;
  }
  .adv-tab .ico { --s: 1.6rem; }
  .adv-tab[aria-pressed="true"] { background: var(--chip); color: var(--ink); box-shadow: 0 2px 0 var(--grid); }
  .adv-tab .count { font-weight: 400; font-size: .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .chip {
    display: inline-flex; align-items: center; gap: .4rem; flex: none;
    padding: .2rem .7rem .2rem .2rem; border: 1px solid var(--grid); border-radius: 999px; background: none;
    color: var(--ink-soft); font: 600 .85rem Figtree, system-ui, sans-serif; cursor: pointer;
  }
  .chip.all { padding-left: .7rem; }
  .chip .head { width: 22px; height: 22px; box-shadow: none; border-radius: 50%; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sky-low); }
  .advs { list-style: none; margin: .4rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: .5rem; }
  .adv { display: flex; align-items: flex-start; gap: .55rem; padding: .5rem .75rem .6rem .35rem; background: var(--panel); border-radius: 6px; cursor: default; }
  .adv-text { min-width: 0; display: flex; flex-direction: column; gap: .1rem; padding-top: .3rem; }
  .adv-title { font-weight: 600; line-height: 1.25; }
  .adv-desc { font-size: .8rem; line-height: 1.3; color: var(--ink-soft); }
  .adv-who { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: .35rem; font-size: .8rem; color: var(--ink-soft); }
  .adv-who .head { width: 20px; height: 20px; box-shadow: none; border-radius: 2px; }
  .adv.none .adv-title { color: var(--ink-soft); }
  .adv.dim { opacity: .5; }
  .adv:hover, .adv:focus-visible { background: var(--tile); }
  @media (max-width: 40rem) {
    .advs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .4rem; }
    .adv { gap: .3rem; padding: .35rem .5rem .5rem .15rem; }
    .adv .frame { --s: 2.6rem; }
    .adv .frame > .ico { --s: 1.3rem; }
    .adv-text { padding-top: .2rem; }
    .adv-title { font-size: .85rem; overflow-wrap: anywhere; }
    .adv-desc { display: none; }
    .adv-who { gap: 3px; margin-top: .25rem; }
    .adv-who .head { width: 16px; height: 16px; }
  }
  /* Quien lo consiguió primero (o ganó el premio) brilla */
  img.head.first { box-shadow: 0 0 0 2px var(--gold), 0 0 10px 2px var(--gold-glow); }

  /* Mapa 3D (BlueMap): se carga al pulsar, para no gastar datos ni atrapar el scroll en móvil */
  .map-link { font-size: .9rem; color: var(--ink-soft); }
  .map {
    border-radius: 6px; overflow: hidden;
    background: var(--panel);
    background-image: linear-gradient(var(--track) 1px, transparent 1px), linear-gradient(90deg, var(--track) 1px, transparent 1px);
    background-size: 24px 24px; background-position: center;
  }
  .map.on { height: clamp(20rem, 65vh, 42rem); background: var(--panel); }
  .map iframe { display: block; width: 100%; height: 100%; border: 0; }
  .map-cover { display: grid; justify-items: center; gap: 1rem; padding: 2.5rem 1.25rem; text-align: center; }
  .map-cover p { margin: 0; max-width: 22rem; color: var(--ink-soft); }
  .map-cover .btn:disabled { opacity: .55; cursor: default; transform: none; }

  form { display: grid; gap: .75rem; }
  label { font-weight: 600; }
  input {
    font: inherit; padding: .75rem .9rem;
    border: 2px solid var(--dirt); border-radius: 6px;
    background: var(--panel); color: var(--ink);
  }
  .btn {
    font: 700 1rem Silkscreen, "Courier New", monospace;
    padding: .8rem 1.1rem; cursor: pointer;
    color: #fff; background: var(--grass);
    border: 0; border-radius: 4px;
    box-shadow: 0 4px 0 var(--grass-dark);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--grass-dark); }
  :focus-visible { outline: 3px solid #ffd54a; outline-offset: 2px; }

  /* Avisos: botón redondo en la esquina con su panel */
  .dock { position: sticky; bottom: 0; z-index: 5; height: calc(5rem + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
  .dock[hidden] { display: none; }
  .fab {
    position: absolute; right: max(1rem, env(safe-area-inset-right, 0px)); bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    display: grid; place-items: center; width: 3.5rem; height: 3.5rem; padding: 0;
    border: 0; border-radius: 50%; color: #fff; background: var(--grass); cursor: pointer; pointer-events: auto;
    box-shadow: 0 4px 0 var(--grass-dark), 0 8px 20px rgba(0,0,0,.25);
  }
  .fab:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--grass-dark), 0 4px 12px rgba(0,0,0,.25); }
  .fab[data-state="on"]::after {
    content: ""; position: absolute; top: .55rem; right: .6rem; width: .7rem; height: .7rem;
    border-radius: 50%; background: #ffd54a; box-shadow: 0 0 0 2px var(--grass);
  }
  .fab[data-state="blocked"] { background: #6b7785; box-shadow: 0 4px 0 #4d5762, 0 8px 20px rgba(0,0,0,.25); }
  .push {
    position: absolute; right: max(1rem, env(safe-area-inset-right, 0px)); bottom: calc(5.4rem + env(safe-area-inset-bottom, 0px));
    width: min(21rem, calc(100vw - 2rem)); display: grid; gap: .75rem; padding: 1rem;
    background: var(--pop); color: var(--ink); border-radius: 10px; pointer-events: auto;
    box-shadow: 0 12px 32px rgba(0,0,0,.28); font-size: .95rem;
  }
  .push[hidden] { display: none; }
  .push p { margin: 0; }
  .push .btn { font-size: .85rem; padding: .65rem .9rem; justify-self: start; }
  .push select { font: inherit; padding: .25rem .4rem; border: 1px solid var(--grid); border-radius: 4px; background: var(--chip); color: var(--ink); }
  .push .muted { font-size: .85rem; }
  .push .link { justify-self: start; color: var(--ink-soft); }
  .push .push-error { color: var(--off); }

  /* Suelo: franja de hierba y tierra */
  footer {
    background: var(--dirt);
    border-top: 14px solid var(--grass);
    box-shadow: inset 0 3px 0 var(--grass-dark);
    color: #f3e6d6;
    padding: 1.1rem 1.25rem 1.4rem;
  }
  .foot {
    max-width: 31.5rem; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    font-size: .95rem;
  }
  .foot .btn { background: var(--dirt-dark); box-shadow: 0 4px 0 #3a2615; font-size: .85rem; }

  /* PC: lo de quién juega arriba a todo el ancho y el resto en dos columnas */
  @media (min-width: 64rem) {
    .wrap { max-width: 80rem; padding: 3.5rem 2rem 2.5rem; }
    .foot { max-width: 76rem; }
    footer { padding-inline: 2rem; }
    .players { grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); }
    .columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 2.5rem; align-items: start; }
    .scroller { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; }
  }

  .loading h1 { opacity: .5; }
  @media (prefers-reduced-motion: no-preference) {
    .player { animation: pop .25s ease-out both; }
    @keyframes pop { from { transform: scale(.96); opacity: 0; } }
  }
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div id="app" aria-live="polite"></div>
    <section id="map" class="sec" hidden>
      <div class="sec-head">
        <h2>Mapa</h2>
        <a class="map-link" id="map-open" target="_blank" rel="noopener">Abrir en otra pestaña ↗</a>
      </div>
      <div class="map" id="map-box">
        <div class="map-cover">
          <p id="map-msg"></p>
          <button class="btn" type="button" id="map-load">Ver el mapa</button>
        </div>
      </div>
    </section>
    <div id="stats" hidden></div>
  </div>
  <div class="dock" id="dock" hidden>
    <section id="push" class="push" aria-label="Avisos" hidden></section>
    <button type="button" class="fab" id="bell" aria-expanded="false" aria-controls="push" aria-label="Avisos">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 2.5a1.5 1.5 0 0 1 1.5 1.5v.6A6 6 0 0 1 18 10.5v3.8l1.7 2.3a1 1 0 0 1-.8 1.6H5.1a1 1 0 0 1-.8-1.6L6 14.3v-3.8a6 6 0 0 1 4.5-5.9V4A1.5 1.5 0 0 1 12 2.5z"/><path fill="currentColor" d="M9.5 19.5h5a2.5 2.5 0 0 1-5 0z"/></svg>
    </button>
  </div>
</main>
<div id="tip" class="tip" role="tooltip" hidden></div>
<footer>
  <div class="foot">
    <span id="updated">Cargando…</span>
    <button class="btn" id="refresh" type="button">Actualizar</button>
  </div>
</footer>

<script>
(() => {
  const REFRESH_MS = 60_000;
  const app = document.getElementById("app");
  const updatedEl = document.getElementById("updated");
  const refreshBtn = document.getElementById("refresh");
  const statsEl = document.getElementById("stats");
  const pushEl = document.getElementById("push");
  const dock = document.getElementById("dock");
  const bell = document.getElementById("bell");
  const tip = document.getElementById("tip");
  let lastOk = null;
  let timer = null;
  let status = null;  // último estado del server

  // --- Qué servidor mirar: ?ip= en la URL > constante SERVER > guardado en el navegador
  function getServer() {
    const fromUrl = new URLSearchParams(location.search).get("ip");
    if (fromUrl) return fromUrl.trim();
    if (SERVER) return SERVER.trim();
    try { return localStorage.getItem("mc-server") || ""; } catch { return ""; }
  }
  function saveServer(ip) {
    try { localStorage.setItem("mc-server", ip); } catch {}
    const url = new URL(location.href);
    url.searchParams.set("ip", ip);
    history.replaceState(null, "", url);
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const load = key => { try { return localStorage.getItem(key); } catch { return null; } };
  const save = (key, value) => { try { localStorage.setItem(key, value); } catch {} };

  // --- Dos APIs públicas gratuitas; si una falla se usa la otra
  async function fetchMcstatus(ip) {
    const r = await fetch(`https://api.mcstatus.io/v2/status/java/${encodeURIComponent(ip)}`);
    if (!r.ok) throw new Error("mcstatus " + r.status);
    const d = await r.json();
    return {
      online: !!d.online,
      count: d.players?.online ?? 0,
      max: d.players?.max ?? 0,
      names: (d.players?.list || []).map(p => p.name_clean || p.name_raw).filter(Boolean),
    };
  }
  async function fetchMcsrvstat(ip) {
    const r = await fetch(`https://api.mcsrvstat.us/3/${encodeURIComponent(ip)}`);
    if (!r.ok) throw new Error("mcsrvstat " + r.status);
    const d = await r.json();
    return {
      online: !!d.online,
      count: d.players?.online ?? 0,
      max: d.players?.max ?? 0,
      names: (d.players?.list || []).map(p => p.name).filter(Boolean),
    };
  }
  async function getStatus(ip) {
    try { return await fetchMcstatus(ip); }
    catch { return await fetchMcsrvstat(ip); }
  }

  // --- Pintado
  function renderAsk() {
    updatedEl.textContent = "";
    refreshBtn.hidden = true;
    statsEl.hidden = true;
    mapEl.hidden = true;
    dock.hidden = true;
    app.innerHTML = `
      <h1>¿Qué server miramos?</h1>
      <p class="sub">Escribe la dirección que usáis en Minecraft. Se guarda en el enlace para compartirlo.</p>
      <form id="f">
        <label for="ip">Dirección del servidor</label>
        <input id="ip" name="ip" required placeholder="mc.ejemplo.com o 1.2.3.4:25565" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn" type="submit">Ver jugadores</button>
      </form>`;
    document.getElementById("f").addEventListener("submit", e => {
      e.preventDefault();
      const ip = document.getElementById("ip").value.trim();
      if (!ip) return;
      saveServer(ip);
      start();
    });
  }

  function headline(s) {
    if (!s.online) return { text: "Servidor apagado", cls: "off" };
    if (s.count === 0) return { text: "No hay nadie", cls: "" };
    if (s.count === 1) return { text: "Hay 1 jugando", cls: "" };
    return { text: `Hay ${s.count} jugando`, cls: "" };
  }

  function render(ip, s) {
    status = s;
    const h = headline(s);
    const real = s.names.filter(n => !/^anonymous player$/i.test(n));
    const hidden = Math.max(0, s.count - real.length);

    let sub = "";
    if (!s.online) sub = "Nadie puede entrar ahora mismo.";
    else if (s.count === 0) sub = `0 de ${s.max} plazas ocupadas. Sé el primero.`;
    else sub = `${s.count} de ${s.max} plazas ocupadas.`;

    sub = "Netanyahu kiss my feet please"

    const list = real.map(n => `
      <li class="player">
        <img class="head" src="https://mc-heads.net/avatar/${encodeURIComponent(n)}/64" alt="" width="56" height="56" loading="lazy">
        <span class="player-name">${esc(n)}</span>
      </li>`).join("");

    const note = hidden > 0
      ? `<p class="note">${hidden === 1 ? "Hay 1 jugador" : `Hay ${hidden} jugadores`} sin nombre visible (tienen desactivado “Permitir listado en servidores” o el servidor solo muestra una parte de la lista).</p>`
      : "";

    app.innerHTML = `
      <p class="addr">${esc(ip)}<button type="button" id="change">Cambiar</button></p>
      <h1 class="${h.cls}">${h.text}</h1>
      <p class="sub">${sub}</p>
      ${list ? `<ul class="players">${list}</ul>` : hidden ? "" : lastPlayed()}
      ${note}`;
    document.getElementById("change").addEventListener("click", () => {
      try { localStorage.removeItem("mc-server"); } catch {}
      history.replaceState(null, "", location.pathname);
      clearInterval(timer);
      renderAsk();
    });

    document.title = s.online ? `(${s.count}) ¿Quién está en el server?` : "Apagado · ¿Quién está en el server?";
    online = new Set(s.online ? real : []);
    renderStats();
    renderMap();
  }

  // Cuando no hay nadie: quién fue el último (según el historial de sesiones, que va con ~1 h de retraso)
  function lastPlayed() {
    if (!stats || getServer() !== SERVER) return "";
    let last = null;
    for (const p of stats.players)
      for (const [, end] of stats.sessions[p.uuid] || []) if (!last || end > last.end) last = { name: p.name, end };
    return last ? `<p class="last">${head(last.name, 28)}<span>Último en jugar: <b>${esc(last.name)}</b>, ${ago(last.end)}</span></p>` : "";
  }

  function renderError(ip) {
    app.innerHTML = `
      <p class="addr">${esc(ip)}</p>
      <h1 class="off">Sin respuesta</h1>
      <p class="sub">No se pudo consultar el estado. Revisa tu conexión o que la dirección sea correcta, y pulsa Actualizar.</p>`;
  }

  // ============ Estadísticas: stats.json, que genera .github/workflows/mc-stats.yml ============
  let stats = null;            // último stats.json
  let adv = null;              // advancements.json: logros del juego e iconos
  let advById = new Map();
  let online = new Set();      // quién está conectado según el estado del server
  let rankMode = "total";      // ranking: "total" o "week"
  let timelineOn = load("mc-timeline") === "1";  // vista avanzada de horas por día
  let tlMode = load("mc-timeline-mode") || "day"; // "day" (por día) o "sum" (acumulado)
  let advTab = "story";        // pestaña de logros
  let advPlayer = "";          // logros de un jugador ("" = de todos)
  let colorOrder = [];         // jugadores por orden de llegada (el de sus colores)

  const DAY = 86400;
  const nf = new Intl.NumberFormat("es-ES");
  const nf1 = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 1 });
  const dateFmt = new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "short" });
  const dayFmt = new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "short" });
  const list = new Intl.ListFormat("es-ES", { type: "conjunction" });
  const num = n => nf.format(n);
  const plural = (n, one, many) => `${num(n)} ${n === 1 ? one : many}`;
  const km = m => m < 1000 ? `${num(m)} m` : `${nf1.format(m / 1000)} km`;
  const short = s => s < 3600 ? `${Math.round(s / 60)} min` : `${nf1.format(s / 3600)} h`;
  const date = ts => dateFmt.format(ts * 1000);
  const dayKey = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  const head = (name, size, cls = "", alt = "") => `<img class="head${cls ? " " + cls : ""}" src="https://mc-heads.net/avatar/${encodeURIComponent(name)}/64" alt="${esc(alt)}" width="${size}" height="${size}" loading="lazy">`;
  const onlineDot = name => online.has(name) ? `<span class="dot" role="img" aria-label="Jugando ahora"></span>` : "";

  // Iconos de advancements.png (rejilla de adv.cols x adv.rows)
  const sprite = i => `background-position:${i % adv.cols / (adv.cols - 1) * 100}% ${Math.floor(i / adv.cols) / Math.max(1, adv.rows - 1) * 100}%`;
  const icon = i => `<span class="ico" style="${sprite(i)}" aria-hidden="true"></span>`;
  const framed = (a, got) => `<span class="ico frame" style="${sprite(adv.frames[a.frame][got ? 1 : 0])}" aria-hidden="true">${icon(a.icon)}</span>`;

  function formatTime(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
    if (h === 0) return m > 0 ? `${m} min` : sec > 0 ? "< 1 min" : "0 min";
    return `${h} h ${m} min`;
  }
  function ago(ts) {
    const s = Date.now() / 1000 - ts;
    if (s < 3600) return `hace ${Math.max(1, Math.round(s / 60))} min`;
    if (s < DAY) return `hace ${Math.round(s / 3600)} h`;
    return `el ${date(ts)}`;
  }

  // --- Sesiones [entrada, salida] -> tiempo por día y por hora (en la hora local de quien mira)
  function activity(sessions) {
    const byDay = new Map(), byHour = new Array(24).fill(0);
    let longest = 0, last = 0, week = 0;
    const weekAgo = Date.now() / 1000 - 7 * DAY;
    for (const [start, end] of sessions) {
      longest = Math.max(longest, end - start);
      last = Math.max(last, end);
      week += Math.max(0, end - Math.max(start, weekAgo));
      for (let t = start; t < end;) {
        const d = new Date(t * 1000);
        const nextHour = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours() + 1) / 1000;
        const next = Math.min(end, Math.max(t + 1, nextHour));
        byDay.set(dayKey(d), (byDay.get(dayKey(d)) || 0) + next - t);
        byHour[d.getHours()] += next - t;
        t = next;
      }
    }
    const night = byHour.slice(0, 6).reduce((a, b) => a + b, 0);
    const first = sessions[0]?.[0];
    return { byDay, byHour, longest, last, week, night, first, ...streaks(byDay, first) };
  }

  function streaks(byDay, first) {
    if (!first) return { streak: 0, bestStreak: 0 };
    let run = 0, best = 0, before = 0;
    const d = new Date(first * 1000);
    d.setHours(0, 0, 0, 0);
    for (const now = new Date(); d <= now; d.setDate(d.getDate() + 1)) {
      before = run;
      run = byDay.has(dayKey(d)) ? run + 1 : 0;
      best = Math.max(best, run);
    }
    return { streak: run || before, bestStreak: best };  // si hoy aún no ha jugado, la racha de ayer sigue viva
  }

  function lastDays(n) {
    return Array.from({ length: n }, (_, i) => {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() - (n - 1 - i));
      return d;
    });
  }

  // --- Piezas de HTML
  const tiles = items => `<dl class="tiles">${items.map(([label, value, extra]) =>
    `<div><dt>${label}</dt><dd>${value}${extra ? `<small>${extra}</small>` : ""}</dd></div>`).join("")}</dl>`;

  const favs = items => `<dl class="favs">${items.filter(([, t]) => t).map(([label, t]) =>
    `<div><dt>${label}</dt><dd>${esc(t.name)} <span class="muted">· ${num(t.count)}</span></dd></div>`).join("")}</dl>`;

  const legend = (players, lines) => players.length < 2 ? "" : `<ul class="legend${lines ? " lines" : ""}">${players.map(p =>
    `<li><i style="background:${p.color}"></i>${esc(p.name)}</li>`).join("")}</ul>`;

  // Líneas del tooltip: "texto" o "color|valor|jugador" (con su marca de color)
  const tipRow = (color, value, label) => `${color}|${value}|${label}`;
  const tipText = t => t.split("\n").map(line => line.split("|").slice(-2).join(" ")).join(", ");

  // Columnas de tiempo: [{ label, segs: [[segundos, color]], tip }], apiladas. Solo la más alta lleva su valor.
  function columns(items, small) {
    items.forEach(it => it.total = it.segs.reduce((a, [v]) => a + v, 0));
    const max = Math.max(...items.map(i => i.total));
    if (!max) return `<p class="muted">Sin partidas en este periodo.</p>`;
    const peak = items.findIndex(i => i.total === max);
    const cols = items.map((it, i) => `
      <div class="col" tabindex="0" data-tip="${esc(it.tip)}" aria-label="${esc(tipText(it.tip))}">
        ${i === peak ? `<span class="col-val">${short(max)}</span>` : ""}
        <span class="col-bar" style="height:${it.total ? Math.max(2, it.total / max * 100) : 0}%">${it.segs.filter(([v]) => v).map(([v, color]) =>
          `<span style="flex-grow:${v};background:${color}"></span>`).join("")}</span>
      </div>`).join("");
    const labels = items.map(it => `<span>${esc(it.label)}</span>`).join("");
    return `<div class="chart${small ? " small" : ""}"><div class="cols">${cols}</div><div class="xlabels">${labels}</div></div>`;
  }

  // Tooltip de una columna apilada: total, cuándo y cuánto jugó cada uno
  const stackTip = (when, segs) => {
    const total = segs.reduce((a, s) => a + s.value, 0);
    return [total ? formatTime(total) : "Sin partidas", when,
      ...segs.filter(s => s.value).sort((a, b) => b.value - a.value).map(s => tipRow(s.color, formatTime(s.value), s.name))].join("\n");
  };

  const MEDIA = { foot: "A pie", swim: "Nadando", ride: "Montando", vehicle: "Barco y vagoneta", fly: "Por el aire" };

  // [icono de advancements.json, emoji si no carga, premio, qué mide, valor, formato]
  const AWARDS = [
    ["diamond_pickaxe", "⛏️", "El Minero", "Más bloques minados", p => p.mined, n => plural(n, "bloque", "bloques")],
    ["diamond", "💎", "El Rico", "Más diamantes minados", p => p.diamonds, n => plural(n, "diamante", "diamantes")],
    ["bow", "🗡️", "El Cazador", "Más mobs matados", p => p.mobKills, n => plural(n, "mob", "mobs")],
    ["iron_sword", "🔪", "El Traidor", "Más amigos matados", p => p.playerKills, n => plural(n, "baja", "bajas")],
    ["tnt", "💀", "El Kamikaze", "Más muertes", p => p.deaths, n => plural(n, "muerte", "muertes")],
    ["totem_of_undying", "🛡️", "El Superviviente", "Más tiempo de juego sin morir", p => p.sinceDeath, formatTime],
    ["compass", "🧭", "El Explorador", "Más distancia recorrida", p => p.distanceTotal, km],
    ["rabbit_foot", "🦘", "El Canguro", "Más saltos", p => p.jumps, n => plural(n, "salto", "saltos")],
    ["full", "🥊", "El Saco de Boxeo", "Más daño recibido", p => p.damageTaken, n => `${num(n)} ❤`],
    ["red_bed", "🛏️", "El Dormilón", "Más veces durmiendo", p => p.sleeps, n => plural(n, "siesta", "siestas")],
    ["crafting_table", "🔨", "El Artesano", "Más objetos fabricados", p => p.crafted, n => plural(n, "objeto", "objetos")],
    ["knowledge_book", "🏆", "El Completista", "Más logros", p => p.advancements, n => plural(n, "logro", "logros")],
    ["clock", "🏃", "El Maratoniano", "Sesión más larga", p => p.longest, formatTime],
    ["phantom_membrane", "🦉", "El Noctámbulo", "Más tiempo jugado entre las 0 y las 6 h", p => p.night, formatTime],
    ["bone", "📅", "El Fiel", "Más días seguidos jugando", p => p.bestStreak, n => plural(n, "día", "días")],
  ];

  // [logro, descripción si no carga advancements.json] en orden de progreso
  const MILESTONES = [
    ["story/smelt_iron", "Fundir hierro"],
    ["story/mine_diamond", "Encontrar diamantes"],
    ["story/enter_the_nether", "Entrar al Nether"],
    ["adventure/trade", "Comerciar con un aldeano"],
    ["husbandry/tame_an_animal", "Domesticar un animal"],
    ["nether/find_fortress", "Encontrar una fortaleza del Nether"],
    ["story/follow_ender_eye", "Encontrar una fortaleza"],
    ["story/enter_the_end", "Entrar al End"],
    ["end/kill_dragon", "Matar al dragón"],
    ["end/elytra", "Conseguir unos élitros"],
    ["nether/obtain_ancient_debris", "Encontrar escombros ancestrales"],
    ["nether/summon_wither", "Invocar al Wither"],
    ["nether/netherite_armor", "Armadura completa de netherita"],
  ];

  const TABS = ["story", "nether", "end", "adventure", "husbandry"];
  const FRAME_NAMES = { goal: "Meta", challenge: "Desafío" };

  // Quién tiene cada logro: {id: [{name, time}]} por orden de llegada.
  // Sin la lista por jugador (stats.json antiguo) solo se sabe quién fue el primero.
  function advWho() {
    const who = new Map();
    const add = (id, name, time) => (who.get(id) || who.set(id, []).get(id)).push({ name, time });
    if (stats.players.some(p => p.done))
      for (const p of stats.players) for (const [id, time] of Object.entries(p.done || {})) add(id, p.name, time);
    else
      for (const [id, f] of Object.entries(stats.firsts)) add(id.replace(/^minecraft:/, ""), f.name, f.time);
    for (const l of who.values()) l.sort((a, b) => a.time - b.time);
    return who;
  }

  // --- Secciones
  function sectionPlayers(players, openIds) {
    const key = rankMode === "week" ? "week" : "playtime";
    const sorted = [...players].sort((a, b) => b[key] - a[key]);
    const max = Math.max(1, sorted[0][key]);
    const btn = (mode, label) => `<button type="button" data-mode="${mode}" aria-pressed="${rankMode === mode}">${label}</button>`;
    return `
      <section class="sec">
        <div class="sec-head">
          <h2>Jugadores</h2>
          <div class="seg" role="group" aria-label="Periodo">${btn("total", "Total")}${btn("week", "Últimos 7 días")}</div>
        </div>
        <ol class="ranking">${sorted.map((p, i) => `<li>${ficha(p, i + 1, p[key] / max, formatTime(p[key]), openIds.has(p.uuid))}</li>`).join("")}</ol>
      </section>`;
  }

  function ficha(p, pos, share, time, open) {
    const seen = online.has(p.name) ? `<span class="dot"></span>Jugando ahora` : p.last ? `Visto ${ago(p.last)}` : "";
    const dist = Object.entries(p.distance).filter(([, m]) => m > 0).sort((a, b) => b[1] - a[1]);
    const days = lastDays(14).map(d => {
      const v = p.byDay.get(dayKey(d)) || 0;
      return { label: d.getDate(), segs: [[v, p.color]], tip: `${v ? formatTime(v) : "Sin partidas"}\n${dayFmt.format(d)}` };
    });
    // Últimos logros: con la lista por jugador salen en inglés y con su icono
    const recent = p.done && adv
      ? Object.entries(p.done).filter(([id]) => advById.has(id) && !id.endsWith("/root")).sort((a, b) => b[1] - a[1]).slice(0, 4)
          .map(([id, time]) => `<li><span class="with-ico">${icon(advById.get(id).icon)}<span>${esc(advById.get(id).title)}</span></span><span class="muted">${date(time)}</span></li>`)
      : (p.recentAdvancements || []).map(a => `<li><span>${esc(a.title)}</span><span class="muted">${date(a.time)}</span></li>`);
    const seeAll = p.done && adv ? `<button type="button" class="link" data-adv-player="${esc(p.name)}" data-go="logros">Ver todos</button>` : "";
    return `
      <details class="ficha" id="j-${p.uuid}" data-uuid="${p.uuid}"${open ? " open" : ""}>
        <summary>
          <span class="pos">${pos}</span>
          ${head(p.name, 40)}
          <span class="rank-info">
            <span class="rank-line">
              <span class="player-name">${esc(p.name)}${onlineDot(p.name)}</span>
              <span class="time">${time}</span>
            </span>
            <span class="seen">${seen}</span>
            <span class="bar"><span style="width:${(share * 100).toFixed(1)}%;background:${p.color}"></span></span>
          </span>
          <span class="chev" aria-hidden="true"></span>
        </summary>
        <div class="ficha-body">
          ${tiles([
            ["Tiempo jugado", formatTime(p.playtime)],
            ["Últimos 7 días", formatTime(p.week)],
            ["Sesión más larga", formatTime(p.longest)],
            ["Racha", plural(p.streak, "día", "días"), `récord: ${plural(p.bestStreak, "día", "días")}`],
            ["Muertes", num(p.deaths)],
            ["Sin morir", formatTime(p.sinceDeath)],
            ["Mobs matados", num(p.mobKills)],
            ["Amigos matados", num(p.playerKills)],
            ["Distancia", km(p.distanceTotal)],
            ["Diamantes", num(p.diamonds)],
            ["Logros", `${num(p.advancements)} / ${num(stats.advancementsTotal)}`],
            ["Bloques minados", num(p.mined)],
            ["Objetos fabricados", num(p.crafted)],
            ["Saltos", num(p.jumps)],
            ["Daño recibido", `${num(p.damageTaken)} ❤`],
            ["Veces dormido", num(p.sleeps)],
          ])}
          <h3>Favoritos</h3>
          ${favs([
            ["Bloque más minado", p.topMined],
            ["Mob más cazado", p.topKilled],
            ["Lo que más fabrica", p.topCrafted],
            ["Lo que más le mata", p.topKilledBy],
          ])}
          ${dist.length ? `<h3>Distancia por medio</h3><ul class="dist">${dist.map(([k, m]) => `
            <li><span>${MEDIA[k] || esc(k)}</span><span class="time">${km(m)}</span>
              <div class="bar"><span style="width:${(m / dist[0][1] * 100).toFixed(1)}%;background:${p.color}"></span></div></li>`).join("")}</ul>` : ""}
          <h3>Horas jugadas, últimos 14 días</h3>
          ${columns(days, true)}
          ${recent.length ? `<div class="h3-row"><h3>Últimos logros</h3>${seeAll}</div><ul class="recent">${recent.join("")}</ul>` : ""}
        </div>
      </details>`;
  }

  function sectionAwards(players) {
    const cards = AWARDS.map(([iconKey, emoji, title, desc, value, format]) => {
      const ranked = players.filter(p => value(p) > 0).sort((a, b) => value(b) - value(a));
      const best = ranked.length ? value(ranked[0]) : 0;
      const winners = ranked.filter(p => value(p) === best);
      const rest = ranked.filter(p => value(p) < best).slice(0, 2);
      const place = v => 1 + ranked.filter(p => value(p) > v).length;  // con empates, 1º 1º 3º
      const symbol = adv && adv.extra[iconKey] != null ? icon(adv.extra[iconKey]) : `<span class="award-emoji" aria-hidden="true">${emoji}</span>`;
      const win = winners.length
        ? `<span class="award-win">
             <span class="award-heads">${winners.slice(0, 3).map(p => head(p.name, 28, "first")).join("")}</span>
             <span class="award-who"><span class="award-name">${esc(list.format(winners.map(p => p.name)))}</span><span class="award-value">${format(best)}</span></span>
           </span>`
        : `<span class="award-win muted">Nadie todavía</span>`;
      const others = rest.length ? `<span class="award-rest">${rest.map(p =>
        `<span>${place(value(p))}º ${head(p.name, 18, "", p.name)}${format(value(p))}</span>`).join("")}</span>` : "";
      return `
        <li class="award">
          <span class="slot">${symbol}</span>
          <span class="award-text"><span class="award-title">${title}</span><span class="award-desc">${desc}</span></span>
          ${win}${others}
        </li>`;
    }).join("");
    return `<section class="sec"><h2>Premios</h2><ul class="awards">${cards}</ul></section>`;
  }

  function sectionWorld(players, order) {
    const sum = f => players.reduce((total, p) => total + f(p), 0);
    const inChart = items => order.filter((_, i) => items.some(it => it.segs[i][0]));  // para la leyenda
    const days = lastDays(14).map(d => {
      const segs = order.map(p => ({ value: p.byDay.get(dayKey(d)) || 0, color: p.color, name: p.name }));
      return { label: d.getDate(), segs: segs.map(s => [s.value, s.color]), tip: stackTip(dayFmt.format(d), segs) };
    });
    const hours = Array.from({ length: 24 }, (_, h) => {
      const segs = order.map(p => ({ value: p.byHour[h], color: p.color, name: p.name }));
      return { label: h % 6 === 0 ? h : "", segs: segs.map(s => [s.value, s.color]), tip: stackTip(`De ${h}:00 a ${h + 1}:00`, segs) };
    });
    const dayPlayers = inChart(days), hourPlayers = inChart(hours);
    const allPlayers = order.filter(p => p.byDay.size);

    const toggle = `<button type="button" class="switch" role="switch" aria-checked="${timelineOn}" data-action="timeline"><span class="switch-track" aria-hidden="true"></span>Vista avanzada</button>`;
    const tlBtn = (mode, label) => `<button type="button" data-tl="${mode}" aria-pressed="${tlMode === mode}">${label}</button>`;
    const daysCard = timelineOn
      ? `<div class="card">
           <div class="card-head"><h3>${tlMode === "sum" ? "Horas acumuladas" : "Horas jugadas por día"} desde el inicio</h3>${toggle}</div>
           <div class="seg small" role="group" aria-label="Escala">${tlBtn("day", "Por día")}${tlBtn("sum", "Acumulado")}</div>
           ${legend(allPlayers, tlMode === "sum")}
           <div id="timeline" class="timeline" data-chart></div>
         </div>`
      : `<div class="card">
           <div class="card-head"><h3>Horas jugadas por día</h3>${toggle}</div>
           ${legend(dayPlayers)}${columns(days)}
         </div>`;

    const firsts = stats.firsts;
    const hitos = MILESTONES.map(([id, label]) => {
      const f = firsts["minecraft:" + id];
      const a = adv && advById.get(id);
      const name = a ? `<span class="with-ico">${icon(a.icon)}<span>${esc(a.title)}</span></span>` : `<span>${label}</span>`;
      return f
        ? `<li>${name}<span class="hito-who">${head(f.name, 22)}${esc(f.name)} <span class="muted">· ${date(f.time)}</span></span></li>`
        : `<li class="pending">${name}<span>Pendiente</span></li>`;
    }).join("");
    return `
      <section class="sec">
        <h2>El mundo</h2>
        <div class="stack">
          <div class="card">
            ${tiles([
              ["Tiempo jugado", formatTime(sum(p => p.playtime))],
              ["Jugadores", num(players.length)],
              ["Bloques minados", num(sum(p => p.mined))],
              ["Mobs matados", num(sum(p => p.mobKills))],
              ["Muertes", num(sum(p => p.deaths))],
              ["Diamantes", num(sum(p => p.diamonds))],
              ["Distancia", km(sum(p => p.distanceTotal))],
              ["Logros", `${num(Object.keys(firsts).length)} / ${num(stats.advancementsTotal)}`],
            ])}
          </div>
          <div class="card">
            <h3>Lo más…</h3>
            ${favs([
              ["Bloque más minado", stats.world.topMined],
              ["Mob más cazado", stats.world.topKilled],
              ["Lo que más mata", stats.world.topKilledBy],
            ])}
          </div>
          ${daysCard}
          <div class="card"><h3>¿A qué hora se juega?</h3>${legend(hourPlayers)}${columns(hours)}</div>
          <div class="card"><h3>Hitos: quién lo consiguió primero</h3><ul class="hitos">${hitos}</ul></div>
        </div>
      </section>`;
  }

  function sectionAdvancements(players) {
    if (!adv) return "";
    const who = advWho();
    const perPlayer = stats.players.some(p => p.done);
    if (!perPlayer || !players.some(p => p.name === advPlayer)) advPlayer = "";
    const has = a => advPlayer ? (who.get(a.id) || []).some(w => w.name === advPlayer) : who.has(a.id);
    const all = adv.advancements;
    const got = all.filter(has).length;

    const tabs = TABS.map(tab => {
      const items = all.filter(a => a.id.startsWith(tab + "/"));
      const root = items[0];
      return `<button type="button" class="adv-tab" aria-pressed="${tab === advTab}" data-adv-tab="${tab}">
        ${icon(root.icon)}<span>${esc(root.title)}</span><span class="count">${items.filter(has).length}/${items.length}</span></button>`;
    }).join("");
    const chips = perPlayer ? `<div class="scroller" role="group" aria-label="Ver los logros de">
      <button type="button" class="chip all" data-adv-player="" aria-pressed="${!advPlayer}">Todos</button>
      ${players.map(p => `<button type="button" class="chip" data-adv-player="${esc(p.name)}" aria-pressed="${advPlayer === p.name}">${head(p.name, 22)}${esc(p.name)}</button>`).join("")}
    </div>` : "";

    const cards = all.filter(a => a.id.startsWith(advTab + "/")).map(a => {
      const owners = who.get(a.id) || [];
      const mine = has(a);
      const kind = FRAME_NAMES[a.frame] ? ` · ${FRAME_NAMES[a.frame]}` : "";
      const tipLines = [a.title + kind, a.description, ...(owners.length
        ? owners.map((w, i) => `${i === 0 ? "Primero: " : ""}${w.name} · ${date(w.time)}`)
        : ["Nadie lo tiene todavía"])];
      const heads = owners.length
        ? owners.map((w, i) => head(w.name, 20, i === 0 ? "first" : "", w.name)).join("") + (perPlayer ? "" : `<span>primero</span>`)
        : `<span>Nadie todavía</span>`;
      return `
        <li class="adv${owners.length ? "" : " none"}${advPlayer && !mine ? " dim" : ""}" tabindex="0" data-tip="${esc(tipLines.join("\n"))}">
          ${framed(a, mine)}
          <span class="adv-text">
            <span class="adv-title">${esc(a.title)}</span>
            <span class="adv-desc">${esc(a.description)}</span>
            <span class="adv-who">${heads}</span>
          </span>
        </li>`;
    }).join("");

    return `
      <section class="sec" id="logros">
        <h2>Logros</h2>
        <p class="adv-sum">${advPlayer ? `${esc(advPlayer)} tiene` : "Entre todos tenéis"} <b>${num(got)}</b> de ${num(all.length)}</p>
        <div class="scroller" role="group" aria-label="Categoría">${tabs}</div>
        ${chips}
        <ul class="advs">${cards}</ul>
      </section>`;
  }

  function renderStats() {
    if (!stats || getServer() !== SERVER || !stats.players.length) return;
    const openIds = new Set([...statsEl.querySelectorAll("details[open]")].map(d => d.dataset.uuid));
    const players = stats.players.map(p => ({
      ...p,
      ...activity(stats.sessions[p.uuid] || []),
      distanceTotal: Object.values(p.distance).reduce((a, b) => a + b, 0),
    }));
    // Color de cada jugador por orden de llegada, para que no cambie aunque cambie el ranking
    const order = [...players].sort((a, b) => (a.first ?? Infinity) - (b.first ?? Infinity) || a.name.localeCompare(b.name));
    order.forEach((p, i) => p.color = i < 8 ? `var(--p${i + 1})` : "var(--p-other)");
    const firstSession = Math.min(...Object.values(stats.sessions).flat().map(s => s[0]));
    hideTip();
    statsEl.innerHTML = `
      <div class="columns">
        <div>${sectionPlayers(players, openIds)}${sectionAwards(players)}</div>
        <div>${sectionWorld(players, order)}</div>
      </div>
      ${sectionAdvancements(players)}
      <p class="note">Se actualiza cada hora aprox.${isFinite(firstSession) ? ` Las sesiones se registran desde el ${date(firstSession)}.` : ""}</p>`;
    statsEl.hidden = false;
    colorOrder = order;
    drawTimeline(order);
  }

  // --- Vista avanzada: horas por día (áreas apiladas) o acumuladas (líneas) desde la primera sesión
  function drawTimeline(order) {
    const box = document.getElementById("timeline");
    if (!box) return;
    const starts = order.flatMap(p => (stats.sessions[p.uuid] || []).map(s => s[0]));
    if (!starts.length) { box.innerHTML = `<p class="muted">Sin partidas todavía.</p>`; return; }
    const days = [];
    const end = new Date(); end.setHours(12, 0, 0, 0);
    for (const d = new Date(Math.min(...starts) * 1000); d.setHours(12, 0, 0, 0) <= end; d.setDate(d.getDate() + 1)) days.push(new Date(d));
    if (days.length < 2) days.unshift(new Date(days[0] - DAY * 1000));

    const shown = order.filter(p => p.byDay.size);
    const cumulative = tlMode === "sum";
    const raw = shown.map(p => days.map(d => (p.byDay.get(dayKey(d)) || 0) / 3600));
    const series = cumulative ? raw.map(s => { let acc = 0; return s.map(v => acc += v); }) : raw;
    // Por día se apilan: tops[k][i] = suma de los k primeros jugadores
    const tops = cumulative ? series : series.map((_, k) => days.map((_, i) => series.slice(0, k + 1).reduce((a, s) => a + s[i], 0)));
    const peak = Math.max(0.5, ...tops.flat());
    const step = [0.5, 1, 2, 3, 4, 6, 8, 12, 24, 48, 72, 100, 200, 500, 1000].find(s => peak / s <= 4) || 2000;
    const yMax = Math.ceil(peak / step) * step;

    const W = box.clientWidth, H = W < 480 ? 190 : 230, L = 36, R = 8, T = 10, B = 22;
    const x = i => L + i * (W - L - R) / (days.length - 1);
    const y = v => T + (1 - v / yMax) * (H - T - B);
    const pts = (vals) => vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" L");
    const hFmt = v => `${nf1.format(v)} h`;

    let grid = "";
    for (let v = 0; v <= yMax + 1e-9; v += step)
      grid += `<line class="${v ? "gl" : "base"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${hFmt(v)}</text>`;
    const every = Math.ceil(days.length / Math.max(2, Math.floor((W - L - R) / 70)));
    days.forEach((d, i) => {
      if (i % every === 0) grid += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : "middle"}">${dateFmt.format(d)}</text>`;
    });

    let marks = "";
    if (cumulative) {
      shown.forEach((p, k) => {
        const last = series[k].length - 1;
        marks += `<path d="M${pts(series[k])}" fill="none" style="stroke:${p.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="${x(last)}" cy="${y(series[k][last])}" r="4" style="fill:${p.color};stroke:var(--gap)" stroke-width="2"/>`;
      });
    } else {
      shown.forEach((p, k) => {
        const lower = (k ? tops[k - 1] : days.map(() => 0)).map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).reverse();
        marks += `<path d="M${pts(tops[k])} L${lower.join(" L")} Z" style="fill:${p.color}"/>`;
      });
      shown.forEach((p, k) => { if (k < shown.length - 1) marks += `<path class="gapline" d="M${pts(tops[k])}"/>`; });
    }

    const label = cumulative ? "Horas acumuladas por jugador desde el inicio" : "Horas jugadas por día desde el inicio, por jugador";
    box.innerHTML = `
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${label}. Usa las flechas para recorrer los días.">
        ${grid}${marks}
        <g class="hover" visibility="hidden"><line class="cross" y1="${T}" y2="${H - B}"/>${shown.map(p =>
          `<circle r="4" style="fill:${p.color};stroke:var(--gap)" stroke-width="2"/>`).join("")}</g>
        <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/>
      </svg>`;

    const svg = box.querySelector("svg"), hover = svg.querySelector(".hover");
    let current = days.length - 1;
    const show = i => {
      current = Math.max(0, Math.min(days.length - 1, i));
      hover.setAttribute("visibility", "visible");
      hover.querySelector("line").setAttribute("x1", x(current));
      hover.querySelector("line").setAttribute("x2", x(current));
      [...hover.querySelectorAll("circle")].forEach((c, k) => {
        c.setAttribute("cx", x(current));
        c.setAttribute("cy", y(tops[k][current]));
        c.setAttribute("visibility", cumulative || raw[k][current] ? "visible" : "hidden");
      });
      const rows = shown.map((p, k) => [p, series[k][current] * 3600]).filter(([, v]) => v).sort((a, b) => b[1] - a[1]);
      const total = raw.reduce((a, s) => a + s[current], 0) * 3600;
      const lines = cumulative
        ? [dayFmt.format(days[current]), ...rows.map(([p, v]) => tipRow(p.color, formatTime(v), p.name))]
        : [total ? formatTime(total) : "Sin partidas", dayFmt.format(days[current]), ...rows.map(([p, v]) => tipRow(p.color, formatTime(v), p.name))];
      fillTip(lines.join("\n"));
      const r = svg.getBoundingClientRect();
      placeTip({ left: r.left + x(current), width: 0, top: r.top + T, bottom: r.top + T });
    };
    const hide = () => { hover.setAttribute("visibility", "hidden"); hideTip(); };
    const fromPointer = e => {
      const r = svg.getBoundingClientRect();
      show(Math.round((e.clientX - r.left - L) / ((W - L - R) / (days.length - 1))));
    };
    svg.addEventListener("pointermove", fromPointer);
    svg.addEventListener("pointerdown", fromPointer);
    svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hide(); });
    svg.addEventListener("focus", () => show(current));
    svg.addEventListener("blur", hide);
    svg.addEventListener("keydown", e => {
      const moves = { ArrowLeft: -1, ArrowRight: 1, Home: -Infinity, End: Infinity };
      if (!(e.key in moves)) return;
      e.preventDefault();
      show(current + Math.max(-days.length, Math.min(days.length, moves[e.key])));
    });
  }

  // En móvil el alto cambia al hacer scroll (barra del navegador): solo se redibuja si cambia el ancho
  let resizeFrame = 0, lastWidth = innerWidth;
  addEventListener("resize", () => {
    if (innerWidth === lastWidth) return;
    lastWidth = innerWidth;
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => drawTimeline(colorOrder));
  });

  async function loadStats() {
    try {
      const r = await fetch(STATS_URL, { cache: "no-cache" });
      if (!r.ok) return;
      const first = !stats;
      stats = await r.json();
      status && status.count === 0 ? render(getServer(), status) : renderStats();
      if (first) renderPush();  // para la lista de "Yo soy"
    } catch {}
  }

  async function loadAdvancements() {
    if (adv) return;
    try {
      const r = await fetch(ADV_URL);
      if (!r.ok) return;
      adv = await r.json();
      advById = new Map(adv.advancements.map(a => [a.id, a]));
      document.documentElement.style.setProperty("--cols", adv.cols);
      document.documentElement.style.setProperty("--rows", adv.rows);
      renderStats();
    } catch {}
  }

  statsEl.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    if (d.mode) rankMode = d.mode;
    else if (d.action === "timeline") { timelineOn = !timelineOn; save("mc-timeline", timelineOn ? "1" : "0"); }
    else if (d.tl) { tlMode = d.tl; save("mc-timeline-mode", tlMode); }
    else if (d.advTab) advTab = d.advTab;
    else if ("advPlayer" in d) advPlayer = d.advPlayer;
    else return;
    // Se repinta todo: se devuelve el foco al botón equivalente
    const selector = [...b.attributes].filter(a => a.name.startsWith("data-")).map(a => `[${a.name}="${CSS.escape(a.value)}"]`).join("");
    const focused = document.activeElement === b;
    renderStats();
    if (focused) statsEl.querySelector(selector)?.focus({ preventScroll: true });
    if (d.go) document.getElementById(d.go)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });

  // --- Tooltip (ratón, dedo o teclado)
  function fillTip(text) {
    const [first, ...rest] = text.split("\n");
    const strong = document.createElement("strong");
    strong.textContent = first;
    tip.replaceChildren(strong, ...rest.map(line => {
      const parts = line.split("|");
      if (parts.length < 3) return Object.assign(document.createElement("span"), { textContent: line });
      const row = Object.assign(document.createElement("span"), { className: "tip-row" });
      const key = document.createElement("i");
      key.style.background = parts[0];
      row.append(key, Object.assign(document.createElement("b"), { textContent: parts[1] }), " " + parts[2]);
      return row;
    }));
  }
  function placeTip(r) {
    tip.hidden = false;
    const t = tip.getBoundingClientRect();
    const x = Math.min(innerWidth - t.width - 8, Math.max(8, r.left + r.width / 2 - t.width / 2));
    const y = r.top - t.height - 8 < 8 ? r.bottom + 8 : r.top - t.height - 8;
    tip.style.transform = `translate(${x}px, ${y}px)`;
  }
  function showTip(el) {
    fillTip(el.dataset.tip);
    placeTip(el.getBoundingClientRect());
  }
  function hideTip() { tip.hidden = true; }
  document.addEventListener("pointerover", e => {
    if (e.target.closest("[data-chart]")) return;  // la gráfica avanzada lleva su propio tooltip
    const el = e.target.closest("[data-tip]");
    el ? showTip(el) : hideTip();
  });
  document.addEventListener("focusin", e => {
    const el = e.target.closest("[data-tip]");
    if (el) showTip(el);
  });
  document.addEventListener("focusout", e => { if (!e.target.closest("[data-chart]")) hideTip(); });
  addEventListener("scroll", hideTip, { passive: true });

  // ============ Mapa 3D (BlueMap): fuera de #app para que el iframe no se recargue cada minuto ============
  const mapEl = document.getElementById("map");
  const mapBox = document.getElementById("map-box");
  const mapMsg = document.getElementById("map-msg");
  const mapLoad = document.getElementById("map-load");
  document.getElementById("map-open").href = MAP_URL;

  function renderMap() {
    mapEl.hidden = !MAP_URL || getServer() !== SERVER;
    if (mapEl.hidden || mapBox.classList.contains("on")) return;
    // Con el server apagado BlueMap tampoco responde (saldría un error de Cloudflare)
    const off = status && !status.online;
    mapMsg.textContent = off
      ? "El servidor está apagado, así que el mapa no está disponible ahora mismo."
      : "El mundo en 3D. Lo que construyáis aparece a los pocos minutos.";
    mapLoad.disabled = !!off;
  }

  mapLoad.addEventListener("click", () => {
    const frame = document.createElement("iframe");
    frame.src = MAP_URL;
    frame.title = "Mapa 3D del mundo";
    frame.allow = "fullscreen";
    mapBox.classList.add("on");
    mapBox.replaceChildren(frame);
  });

  // ============ Avisos (Web Push): los manda el Worker de Cloudflare de push/worker.js ============
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const installed = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  let pushSub = null;    // suscripción de este dispositivo
  let pushError = "";

  const getMe = () => load("mc-me") || "";
  const setMe = name => save("mc-me", name);
  const b64urlToBytes = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));

  async function pushApi(path, body) {
    const r = await fetch(PUSH_URL + path, body
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
      : undefined);
    if (!r.ok) throw new Error(`${path}: ${r.status}`);
    return r.json();
  }

  function renderPush() {
    dock.hidden = !PUSH_URL || getServer() !== SERVER;
    if (dock.hidden) return;
    const blocked = pushSupported && Notification.permission === "denied";
    bell.dataset.state = pushSub ? "on" : blocked ? "blocked" : "off";
    bell.setAttribute("aria-label", pushSub ? "Avisos activados" : "Avisos");
    let html;
    if (!pushSupported) {
      html = isIOS && !installed
        ? `<p><b>¿Quieres un aviso cuando alguien entre?</b> En iPhone, pulsa <b>Compartir</b> → <b>Añadir a pantalla de inicio</b> y abre la web desde ese icono.</p>`
        : `<p>Este navegador no permite avisos.</p>`;
    } else if (blocked) {
      html = `<p>Has bloqueado las notificaciones de esta web. Para recibir avisos, permítelas en los ajustes del navegador.</p>`;
    } else if (pushSub) {
      const me = getMe();
      const names = [...new Set([me, ...(stats?.players || []).map(p => p.name)].filter(Boolean))].sort((a, b) => a.localeCompare(b));
      html = `
        <p><b>Avisos activados.</b> Te llegará una notificación cuando alguien entre.</p>
        <label>Yo soy <select id="me"><option value="">—</option>${names.map(n =>
          `<option value="${esc(n)}"${n === me ? " selected" : ""}>${esc(n)}</option>`).join("")}</select>
          <span class="muted">(para no avisarte de ti)</span></label>
        <button type="button" class="link" id="push-off">Desactivar</button>`;
    } else {
      html = `<p><b>¿Quieres saber cuándo entra alguien?</b> Te mandamos una notificación al momento.</p><button type="button" class="btn" id="push-on">Activar avisos</button>`;
    }
    pushEl.innerHTML = html + (pushError ? `<p class="push-error">${pushError}</p>` : "");
  }

  function togglePush(open = pushEl.hidden) {
    pushEl.hidden = !open;
    bell.setAttribute("aria-expanded", open);
  }
  bell.addEventListener("click", () => togglePush());
  document.addEventListener("click", e => { if (!pushEl.hidden && !e.composedPath().includes(dock)) togglePush(false); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !pushEl.hidden) { togglePush(false); bell.focus(); }
  });

  async function enablePush() {
    pushError = "";
    try {
      // En iPhone el permiso hay que pedirlo nada más pulsar, antes de cualquier otra espera
      if (await Notification.requestPermission() === "granted") {
        const reg = await navigator.serviceWorker.register("sw.js");
        await navigator.serviceWorker.ready;
        const { key } = await pushApi("/key");
        await (await reg.pushManager.getSubscription())?.unsubscribe();  // por si era de otra clave
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(key) });
        try {
          await pushApi("/subscribe", { subscription: sub.toJSON(), me: getMe() });
        } catch (e) {
          await sub.unsubscribe();
          throw e;
        }
        pushSub = sub;
      }
    } catch {
      pushError = "No se han podido activar los avisos. Inténtalo otra vez.";
    }
    renderPush();
  }

  async function disablePush() {
    const sub = pushSub;
    pushSub = null;
    renderPush();
    await pushApi("/unsubscribe", { endpoint: sub.endpoint }).catch(() => {});
    await sub.unsubscribe().catch(() => {});
  }

  async function initPush() {
    if (pushSupported && PUSH_URL) {
      const reg = await navigator.serviceWorker.getRegistration().catch(() => null);
      pushSub = (await reg?.pushManager.getSubscription()) || null;
      // Se reenvía al abrir la web por si el Worker la perdió (si no ha cambiado, no escribe nada)
      if (pushSub) pushApi("/subscribe", { subscription: pushSub.toJSON(), me: getMe() }).catch(() => {});
    }
    renderPush();
  }

  pushEl.addEventListener("click", e => {
    if (e.target.id === "push-on") enablePush();
    if (e.target.id === "push-off") disablePush();
  });
  pushEl.addEventListener("change", e => {
    if (e.target.id !== "me") return;
    setMe(e.target.value);
    pushApi("/subscribe", { subscription: pushSub.toJSON(), me: e.target.value }).catch(() => {});
  });

  function tickUpdated() {
    if (!lastOk) return;
    const sec = Math.round((Date.now() - lastOk) / 1000);
    updatedEl.textContent = sec < 10 ? "Actualizado ahora" : sec < 60 ? `Actualizado hace ${sec} s` : `Actualizado hace ${Math.floor(sec/60)} min`;
  }

  async function refresh() {
    const ip = getServer();
    if (!ip) return renderAsk();
    if (ip === SERVER) { loadStats(); loadAdvancements(); }
    app.classList.add("loading");
    refreshBtn.disabled = true;
    try {
      const s = await getStatus(ip);
      lastOk = Date.now();
      render(ip, s);
    } catch {
      renderError(ip);
    } finally {
      app.classList.remove("loading");
      refreshBtn.disabled = false;
      tickUpdated();
    }
  }

  function start() {
    refreshBtn.hidden = false;
    renderPush();
    renderMap();
    clearInterval(timer);
    refresh();
    timer = setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
  }

  refreshBtn.addEventListener("click", refresh);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && getServer()) refresh(); });
  setInterval(tickUpdated, 5000);

  getServer() ? start() : renderAsk();
  initPush();
})();
</script>
</body>
</html>
