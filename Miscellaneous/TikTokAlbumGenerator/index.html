<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Album Rating Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/p5@2.0.5/lib/p5.min.js"></script>
  </head>
  <body data-mtab="preview">
    <div id="app">
      <!-- Preview: page tabs on top, the canvas below -->
      <aside id="preview">
        <div id="page-tabs"></div>
        <div id="canvas-container"><div id="canvas-scaler"></div></div>
      </aside>

      <!-- Editor: top bar + content · tracks · design -->
      <main id="workspace">
        <header id="topbar"></header>
        <div id="columns">
          <section class="col" id="col-content" aria-label="Album and page content"></section>
          <section class="col" id="col-tracks" aria-label="Tracks"></section>
          <section class="col" id="json-panel" aria-label="JSON editor"></section>
          <section class="col" id="col-design" aria-label="Design"></section>
        </div>
      </main>
    </div>

    <nav id="mobile-tabbar"></nav>

    <div id="drag-overlay" class="drag-overlay">
      <div class="drag-overlay-content">
        <h3>Drop it here</h3>
        <p>A review .json opens it · an image becomes the album cover</p>
      </div>
    </div>

    <!-- pure logic (also used by the unit tests) -->
    <script src="js/core/model.js"></script>
    <script src="js/core/genres.js"></script>
    <script src="js/render/glitch-core.js"></script>
    <!-- app -->
    <script src="js/ui/dom.js"></script>
    <script src="js/core/store.js"></script>
    <script src="js/render/text.js"></script>
    <script src="js/render/glitch.js"></script>
    <script src="js/render/draw.js"></script>
    <script src="js/ui/actions.js"></script>
    <script src="js/ui/stage.js"></script>
    <script src="js/ui/content.js"></script>
    <script src="js/ui/tracks.js"></script>
    <script src="js/ui/design.js"></script>
    <script src="js/ui/glitchpanel.js"></script>
    <script src="js/ui/selbar.js"></script>
    <script src="js/ui/setup.js"></script>
    <script src="js/ui/topbar.js"></script>
    <script src="js/ui/ai.js"></script>
    <script src="js/export.js"></script>
    <script src="js/anim.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
